name: Build Level Devil APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build APK with Buildozer Action
      uses: ArtemShedow/buildozer-action@v1
      with:
        command: buildozer -v android debug
        submodule: false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LevelDevil-APK
        path: bin/*.apk
        
